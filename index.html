<body>
  <div id="root"></div>
  <script>
    // Prevent Enter from submitting forms
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
        e.preventDefault();
      }
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
